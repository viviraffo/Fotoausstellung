<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photography Exhibit</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
 <div class="main-container grid grid-cols-1 gap-4 bg-indigo-300 p-4">
  <div class="card border rounded p-2">
    <img src="https://cdn.freecodecamp.org/curriculum/labs/colosseo.jpg" alt="Coloseum in Rom" class="rounded-md"/>
    <h1 class="subheading text-white text-xl uppercase font-bold">Antikes Rom</h1>
    <p class="description text-lg text-white">Hier sehen wir ein schönes Bild vom Coloseum in Rom, Italien.</p>
  </div>
    <div class="card border rounded p-2">
    <img src="https://cdn.freecodecamp.org/curriculum/labs/alps.jpg" alt="Landschaftsbild mit Bergen" class="border-black-200 rounded-md"/>
    <h1 class="subheading text-white text-xl uppercase font-bold">Die Berge</h1>
    <p class="description text-lg text-white">Eine schöne Berglandschaft mit Schnee bedenkt vom Sonnenlicht.</p>
  </div>
    <div class="card border rounded p-2">
    <img src="https://cdn.freecodecamp.org/curriculum/labs/sea.jpg" alt="Ein Schiff im Ozean" class="border-black-200 rounded-md"/>
    <h1 class="subheading text-white text-xl uppercase font-bold">Der Ozean</h1>
    <p class="description text-lg text-white">Ein Schiff im türkis blauen Ozean.</p>
  </div>
 </div>
  </body>
</html>
